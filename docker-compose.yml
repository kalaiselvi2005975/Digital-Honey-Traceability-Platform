services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: honeytrace
      POSTGRES_USER: honeytrace
      POSTGRES_PASSWORD: honeytrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeytrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-dev-secret-key
      DATABASE_URL: postgresql://honeytrace:honeytrace@postgres:5432/honeytrace
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
      FRONTEND_URL: http://localhost:5173
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      BLOCKCHAIN_NETWORK: hardhat
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_data:/app/media

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    ports:
      - "8545:8545"

volumes:
  postgres_data:
  media_data:
